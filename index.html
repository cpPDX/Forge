<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FORGE — Survival Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
    }
    #game-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #rotate-msg {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      font-size: 20px;
      text-align: center;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      z-index: 9999;
    }
    #rotate-msg span { font-size: 56px; }
    @media screen and (orientation: portrait) and (pointer: coarse) {
      #rotate-msg { display: flex; }
    }
  </style>
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <div id="rotate-msg">
    <span>&#x21BB;</span>
    Please rotate your device to landscape to play FORGE
  </div>
  <div id="game-container"></div>
  <script>
    (function () {
      function showErr(msg) {
        var el = document.getElementById('forge-err');
        if (!el) { el = document.createElement('div'); el.id = 'forge-err'; document.body.appendChild(el); }
        el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#111;color:#ff5555;font:13px/1.5 monospace;padding:16px;overflow:auto;z-index:99999;white-space:pre-wrap;word-break:break-all';
        el.textContent = msg;
      }
      window.addEventListener('error', function (e) {
        showErr('JS ERROR\n' + e.message + '\n' + (e.filename || '') + ':' + e.lineno + '\n\n' + (e.error && e.error.stack ? e.error.stack : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        showErr('PROMISE REJECTION\n' + (r && r.message ? r.message : String(r)) + '\n\n' + (r && r.stack ? r.stack : ''));
      });
    })();
  </script>
</body>
</html>
